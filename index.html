<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woolstore Invoice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Invoice">
<meta name="theme-color" content="#a0dafd">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one column — numbered steps, one huge button, small month adjuster, backup link */
:root {
  --bg: #eaf4fb;
  --ink: #15304a;
  --muted: #4d6578;
  --sky: #8ec5ea;
  --btn: #1b3a57;
  --btn-ink: #ffffff;
  --card: #ffffff;
  --line: #c6dced;
  --font: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1c27; --ink: #e8f2fa; --muted: #a6bccd; --sky: #6fb3e2; --btn: #8ec5ea;
    --btn-ink: #0b1620; --card: #172836; --line: #2a4256; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1c27; --ink: #e8f2fa; --muted: #a6bccd; --sky: #6fb3e2; --btn: #8ec5ea;
  --btn-ink: #0b1620; --card: #172836; --line: #2a4256; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 20px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
main { max-width: 520px; margin: 0 auto; padding-block: 24px 40px; display: grid; gap: 22px; }
h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); font-size: 1.1rem; }
.lead strong { color: var(--ink); }

ol.steps {
  margin: 0; padding: 16px 18px 16px 18px; list-style: none; counter-reset: s;
  background: var(--card); border: 2px solid var(--sky); border-radius: 16px;
  display: grid; gap: 10px; font-size: 1.1rem;
}
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: start; }
ol.steps li::before {
  content: counter(s); width: 32px; height: 32px; border-radius: 50%;
  background: var(--sky); color: #0b1620; font-weight: 700; display: grid; place-items: center; font-size: 1rem;
}
.addr { font-weight: 700; word-break: break-all; }

#send {
  width: 100%; min-height: 140px; border: 0; border-radius: 22px;
  background: var(--btn); color: var(--btn-ink);
  font: 700 1.9rem/1.15 var(--font); cursor: pointer;
  box-shadow: 0 6px 0 var(--sky);
  display: grid; place-items: center; gap: 6px; padding: 20px;
  -webkit-tap-highlight-color: transparent;
}
#send small { font-size: 1.05rem; font-weight: 400; opacity: .9; }
#send:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sky); }
#send:focus-visible, .plain:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }

.msg { background: var(--card); border-left: 6px solid var(--sky); border-radius: 12px; padding: 14px 16px; font-size: 1.1rem; }
.msg p { margin: 0; }

.month-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.month-row span { color: var(--muted); font-size: 1rem; }
.month-row b { font-size: 1.2rem; }
.month-row button {
  min-width: 52px; min-height: 52px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--card); color: var(--ink); font: 700 1.4rem var(--font); cursor: pointer;
}
.month-row .mid { text-align: center; flex: 1; display: grid; }

.plain {
  background: none; border: 0; padding: 8px 0; color: var(--muted); font: 400 1rem var(--font);
  text-decoration: underline; cursor: pointer; justify-self: center;
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Woolstore rent invoice</h1>
    <p class="lead">This sends the invoice for <strong id="leadMonth">—</strong>.</p>
  </header>

  <ol class="steps">
    <li><span>Press the big blue button.</span></li>
    <li><span>Choose your email app (<b>Outlook</b> or <b>Gmail</b>).</span></li>
    <li><span>Tap the <b>To:</b> box, then tap the email address that pops up above the keyboard.<br><small>It's <span class="addr" id="addrText"></span>, copied for you when you press the button.</small></span></li>
    <li><span>Press <b>Send</b>.</span></li>
  </ol>

  <button id="send" type="button">
    Make the invoice
    <small>The invoice is attached for you</small>
  </button>

  <div class="msg" id="msg" hidden><p id="msgText"></p></div>

  <div class="month-row" aria-label="Change the rent month">
    <button id="prev" type="button" aria-label="Earlier month">‹</button>
    <div class="mid"><span>Rent month</span><b id="monthLabel">—</b></div>
    <button id="next" type="button" aria-label="Later month">›</button>
  </div>

  <button class="plain" id="plain" type="button">Send a plain email instead (no attachment)</button>
</main>

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad = n => String(n).padStart(2, "0");
const money = n => "$" + n.toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Sent at the end of the month for the coming month (late October → November rent).
// If he's a few days late and sends it in the first half of the month, it's for that month.
const today = new Date();
let offset = today.getDate() >= 15 ? 1 : 0;

const rentMonth = () => new Date(today.getFullYear(), today.getMonth() + offset, 1);
const monthName = m => `${MONTHS[m.getMonth()]} ${m.getFullYear()}`;
const dated = () => `${pad(today.getDate())}-${pad(today.getMonth() + 1)}-${today.getFullYear()}`;

/*PDF_START*/
function buildInvoicePdf(JsPDF, info) {
  // info: { dated, month, monthYear, invoiceNo, amount, amountWords }
  const doc = new JsPDF({ unit: "mm", format: "a4" });
  const W = 210, L = 20, R = 190;
  const NAVY = [27, 58, 87], SKY = [142, 197, 234], PALE = [232, 244, 251], GREY = [90, 108, 122];
  const fmt = n => "$" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const gst = Math.round(info.amount / 11 * 100) / 100;

  // Header band
  doc.setFillColor(...PALE); doc.rect(0, 0, W, 58, "F");
  doc.setFillColor(...SKY); doc.rect(0, 58, W, 2.5, "F");

  let tx = L;
  if (info.emblem) { doc.addImage(info.emblem, "PNG", L, 12, 32, 32); tx = L + 38; }
  doc.setTextColor(...NAVY);
  doc.setFont("helvetica", "bold"); doc.setFontSize(24);
  doc.text("RENTAL INVOICE", tx, 27);
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(...GREY);
  doc.text("The Woolstore, Mount Pleasant, S. A.", tx, 35);

  doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(12);
  doc.text("Alan Orrock", R, 20, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  ["89 Ann Street", "Campbelltown, S. A. 5074", "ph 04 03 430 664", "alorrock@hotmail.com"]
    .forEach((t, i) => doc.text(t, R, 26 + i * 5.5, { align: "right" }));

  // Detail boxes
  const boxes = [["Date", info.dated], ["Invoice no.", info.invoiceNo], ["ABN", "68 270 981 564"], ["Account no.", "70202663"]];
  const bw = (R - L - 9) / 4;
  boxes.forEach(([k, v], i) => {
    const x = L + i * (bw + 3);
    doc.setDrawColor(...SKY); doc.setLineWidth(0.5); doc.roundedRect(x, 72, bw, 20, 2, 2, "S");
    doc.setFontSize(8.5); doc.setTextColor(...GREY); doc.text(k.toUpperCase(), x + 4, 79);
    doc.setFontSize(11); doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold");
    doc.text(v, x + 4, 87); doc.setFont("helvetica", "normal");
  });

  // Table
  let y = 108;
  doc.setFillColor(...SKY); doc.rect(L, y, R - L, 10, "F");
  doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(10);
  doc.text("DESCRIPTION", L + 4, y + 6.7);
  doc.text("AMOUNT", R - 4, y + 6.7, { align: "right" });
  y += 10;
  doc.setFillColor(...PALE); doc.rect(L, y, R - L, 26, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(11);
  doc.text("Rental of the Woolstore", L + 4, y + 8);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...GREY);
  doc.text("38 William Street, Mount Pleasant, S. A. 5235", L + 4, y + 14);
  doc.text(`${info.monthYear} (one calendar month)`, L + 4, y + 20);
  doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(11);
  doc.text(fmt(info.amount), R - 4, y + 8, { align: "right" });
  y += 26;

  // Totals
  y += 8;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...GREY);
  doc.text("GST included", R - 80, y); doc.text(fmt(gst), R - 4, y, { align: "right" });
  y += 4;
  doc.setDrawColor(...SKY); doc.setLineWidth(0.6); doc.line(R - 80, y, R, y);
  y += 9;
  doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(14);
  doc.text("Total (incl. GST)", R - 80, y); doc.text(fmt(info.amount), R - 4, y, { align: "right" });

  // Words + payment
  y += 16;
  doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(...NAVY);
  doc.text(`${info.amountWords} (${fmt(info.amount)}), including GST.`, L, y);
  y += 7;
  doc.text(`Rental account for ${info.monthYear}, one calendar month.`, L, y);
  y += 7;
  doc.setFont("helvetica", "bold");
  doc.text("Payment: as per current EFT arrangement.", L, y);

  // Sign-off
  y += 22;
  doc.setFont("helvetica", "normal"); doc.text("Yours sincerely,", L, y);
  doc.setFont("helvetica", "bold"); doc.text("Alan Orrock", L, y + 8);

  // Footer
  doc.setFillColor(...PALE); doc.rect(0, 282, W, 15, "F");
  doc.setFillColor(...SKY); doc.rect(0, 282, W, 1.2, "F");
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GREY);
  doc.text("Alan Orrock  ·  ABN 68 270 981 564  ·  alorrock@hotmail.com  ·  04 03 430 664", W / 2, 291, { align: "center" });

  return doc;
}
/*PDF_END*/

function invoiceInfo() {
  const m = rentMonth();
  return {
    dated: dated(),
    monthYear: monthName(m),
    invoiceNo: `${m.getFullYear()}-${pad(m.getMonth() + 1)}`,
    amount: AMOUNT,
    amountWords: AMOUNT_WORDS,
    emblem: EMBLEM
  };
}

function plainBody() {
  const m = rentMonth();
  return [
    "Alan Orrock,", "", "89 Ann Street,", "Campbelltown, S. A. 5074", "",
    "ph   04 03 430 664          email   alorrock@hotmail.com", "",
    dated(), "", "",
    "ABN      68 270 981 564", "", "Account No.   70202663", "", "",
    "RENTAL  INVOICE", "",
    "Rental Invoice for the Woolstore at 38 William Street, Mount Pleasant, S. A. 5235.", "",
    `Rental Account for ${MONTHS[m.getMonth()]}, ${m.getFullYear()} (One calendar month) including GST.`, "",
    `${AMOUNT_WORDS} (${money(AMOUNT)}).`, "",
    "As per current EFT arrangement.", "", "",
    "Yours sincerely,", "", "Alan Orrock"
  ].join("\r\n");
}

function openPlainEmail() {
  location.href = "mailto:" + SEND_TO + "?subject=" + encodeURIComponent(SUBJECT) +
    "&body=" + encodeURIComponent(plainBody());
}

function say(text) {
  document.getElementById("msgText").textContent = text;
  document.getElementById("msg").hidden = false;
}

function render() {
  const label = monthName(rentMonth());
  document.getElementById("leadMonth").textContent = label;
  document.getElementById("monthLabel").textContent = label;
  document.getElementById("msg").hidden = true;
}

document.getElementById("addrText").textContent = SEND_TO;
document.getElementById("prev").addEventListener("click", () => { if (offset > -1) { offset--; render(); } });
document.getElementById("next").addEventListener("click", () => { if (offset < 3) { offset++; render(); } });
document.getElementById("plain").addEventListener("click", openPlainEmail);

document.getElementById("send").addEventListener("click", async () => {
  // Put the address on the clipboard so he can Paste it into the To: box.
  try { navigator.clipboard && navigator.clipboard.writeText(SEND_TO).catch(() => {}); } catch (e) {}

  if (!window.jspdf) { say("The invoice maker didn't load (no internet?). Sending a plain email instead."); openPlainEmail(); return; }

  const info = invoiceInfo();
  const doc = buildInvoicePdf(window.jspdf.jsPDF, info);
  const m = rentMonth();
  const file = new File([doc.output("blob")], `Woolstore-Invoice-${MONTHS[m.getMonth()]}-${m.getFullYear()}.pdf`, { type: "application/pdf" });

  const data = {
    files: [file],
    title: SUBJECT,
    text: `Please find attached, rental invoice.\n\nYours sincerely,\nAlan Orrock`
  };

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share(data);
      say("Done? If you pressed Send in your email, the invoice is on its way.");
    } catch (e) {
      if (e && e.name === "AbortError") say("Cancelled. Press the big button to try again.");
      else { say("That didn't work, so here's the plain email instead."); openPlainEmail(); }
    }
  } else {
    say("This phone can't attach the invoice, so here's the plain email instead. Just press Send.");
    openPlainEmail();
  }
});

render();

if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
</body>
</html>
